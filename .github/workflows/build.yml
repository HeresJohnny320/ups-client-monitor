name: Test & Build

# Every push to main that changes the program is released automatically as the next
# version (v3.7 -> v3.8) and marked Latest. Pushes that only touch docs or this workflow
# are tested and built but not released. Pushing a tag like v4.0 releases that version,
# and automatic numbering carries on from it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait for each other, so two quick pushes can't claim the same version.
# Pull request runs replace older runs for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...

  version:
    name: Pick version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and history, to find the last version and what changed
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag pushed by hand: release exactly that version.
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The newest version tag, sorted as versions (v3.10 comes after v3.9).
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v1.0
            changed=true
          else
            # Bump the last number: v3.7 -> v3.8, v3.6.1 -> v3.6.2.
            next=$(echo "$last" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')
            # Only release when something that goes into the program changed since $last.
            if git diff --quiet "$last" HEAD -- . ':(exclude)*.md' ':(exclude).github' ':(exclude)LICENSE' ':(exclude).gitignore'; then
              changed=false
            else
              changed=true
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release=$changed" >> "$GITHUB_OUTPUT"
          echo "Last version: ${last:-none}. Next: $next. Program changed: $changed."

  build:
    name: Build ${{ matrix.name }}
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux PCs, servers, Proxmox VMs/LXCs
          - { name: linux-amd64, goos: linux, goarch: amd64 }
          # Raspberry Pi 3/4/5 on 64-bit OS
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          # Raspberry Pi 2/3/4 on 32-bit OS
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: "7" }
          # Raspberry Pi Zero / Pi 1
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: "6" }
          # Older 32-bit PCs
          - { name: linux-386, goos: linux, goarch: "386" }
          - { name: linux-riscv64, goos: linux, goarch: riscv64 }
          - { name: windows-amd64, goos: windows, goarch: amd64, ext: .exe }
          - { name: windows-arm64, goos: windows, goarch: arm64, ext: .exe }
          - { name: windows-386, goos: windows, goarch: "386", ext: .exe }
          - { name: darwin-amd64, goos: darwin, goarch: amd64 }
          - { name: darwin-arm64, goos: darwin, goarch: arm64 }
          # pfSense, OPNsense, TrueNAS CORE
          - { name: freebsd-amd64, goos: freebsd, goarch: amd64 }
          # pfSense Plus on Netgate ARM appliances (1100, 2100)
          - { name: freebsd-arm64, goos: freebsd, goarch: arm64 }
          # Other BSDs and illumos/Solaris (OmniOS, SmartOS, OpenIndiana)
          - { name: openbsd-amd64, goos: openbsd, goarch: amd64 }
          - { name: openbsd-arm64, goos: openbsd, goarch: arm64 }
          - { name: netbsd-amd64, goos: netbsd, goarch: amd64 }
          - { name: netbsd-arm64, goos: netbsd, goarch: arm64 }
          - { name: dragonfly-amd64, goos: dragonfly, goarch: amd64 }
          - { name: illumos-amd64, goos: illumos, goarch: amd64 }
          - { name: solaris-amd64, goos: solaris, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/ups-monitor-${{ matrix.name }}${{ matrix.ext }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: ups-monitor-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish ${{ needs.version.outputs.version }}
    # Pushes to main (and manual runs on main) and version tags; never pull requests,
    # and never when only docs or this workflow changed.
    if: >-
      needs.version.outputs.release == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: dist/*
